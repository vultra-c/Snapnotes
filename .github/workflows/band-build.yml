name: Build Band Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Keystore for Signing
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
        cat > keystore.properties << 'PROPS_EOF'
        storeFile=release.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        PROPS_EOF
        ls -l release.jks keystore.properties

    - name: Build Release APK
      run: |
        for i in 1 2 3; do
          echo "🔨 Build attempt $i ..."
          if ./gradlew assembleRelease --no-daemon --stacktrace; then
            echo "✅ Build succeeded on attempt $i"
            exit 0
          fi
          echo "❌ Build attempt $i failed"
          if [ $i -lt 3 ]; then
            echo "⏳ Waiting 20s before retry..."
            sleep 20
            rm -rf .gradle/configuration-cache
          fi
        done
        echo "💥 All build attempts failed"
        exit 1

    - name: Prepare APK Artifact
      run: |
        BUILD_TIME=$(date +'%Y%m%d_%H%M')
        COMMIT_HASH=${GITHUB_SHA::7}
        mkdir -p build_output

        APK_PATH=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)

        if [ -z "$APK_PATH" ]; then
          echo "❌ 未找到 release APK，尝试查找所有 apk："
          find . -name "*.apk" || true
          exit 1
        fi

        FINAL_NAME="SnapNotes_Band_${BUILD_TIME}_${COMMIT_HASH}.apk"
        cp "$APK_PATH" "build_output/$FINAL_NAME"
        echo "✅ APK 已准备好：$FINAL_NAME"
        ls -lh build_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnapNotes-Band-Release-APK
        path: android-app/build_output/*.apk
        retention-days: 30