name: Vela App Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore signing keys
        run: |
          mkdir -p sign
          echo "${{ secrets.VELA_PRIVATE_KEY_BASE64 }}" | base64 --decode > sign/private.pem
          echo "${{ secrets.VELA_CERT_BASE64 }}" | base64 --decode > sign/certificate.pem

      - name: Build release package
        run: npx aiot release

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: vela-app-release
          path: dist/*.rpk

      - name: Create GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpk
          generate_release_notes: true
