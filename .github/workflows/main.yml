name: Vela App Release

on:
  workflow_dispatch:            # 手动点按钮触发
  push:
    branches:
      - main                    # 每次推送/更新 main 分支源码自动打包
    tags:
      - 'v*'                    # 打 v* 标签时也触发（可选）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vela toolkit
        run: npm install -g @vela/aiot-toolkit @vela/cli

      - name: Restore signing keys
        run: |
          mkdir -p sign
          echo "${{ secrets.VELA_PRIVATE_KEY_BASE64 }}" | base64 --decode > sign/private.pem
          echo "${{ secrets.VELA_CERT_BASE64 }}" | base64 --decode > sign/certificate.pem

      - name: Build release package
        run: aiot release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-app-release
          path: dist/*.rpk

      # 只有打 tag 时才创建 GitHub Release，避免每次 push 都发一个版本
      - name: Create GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpk
          generate_release_notes: true
