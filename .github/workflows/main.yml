name: Vela App Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这样的 tag 时触发

permissions:
  contents: write     # 创建 GitHub Release 必需

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vela toolkit (若已在 package.json 中可去掉这步)
        run: npm install -g @vela/aiot-toolkit @vela/cli

      - name: Restore signing keys
        run: |
          mkdir -p sign
          echo "${{ secrets.VELA_PRIVATE_KEY_BASE64 }}" | base64 --decode > sign/private.pem
          echo "${{ secrets.VELA_CERT_BASE64 }}" | base64 --decode > sign/certificate.pem

      - name: Build release package
        run: aiot release    # 本地安装则用 npx aiot release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-app-release
          path: dist/*.rpk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpk
          generate_release_notes: true
